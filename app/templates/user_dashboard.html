{% extends 'base.html' %}
{% block content %}

<!-- Bootstrap & Custom Styling -->
<style>
    body {
        background: url('https://images.unsplash.com/photo-1522199710521-72d69614c702?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
        background-size: cover;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .dashboard-container {
        background-color: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        padding: 40px;
        max-width: 700px;
        margin: 60px auto;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-primary {
        transition: all 0.3s ease;
    }

    .btn-primary:hover {
        transform: scale(1.05);
    }

    .alert-info {
        animation: slideUp 0.6s ease;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    textarea.form-control:focus {
        box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }
</style>

<div class="dashboard-container">
    <h1 class="text-center mb-4">🌟 User Dashboard</h1>

    <form method="POST" action="{{ url_for('main.analyze') }}" id="reviewForm">
        <div class="mb-3">
            <textarea class="form-control" name="review" rows="4" required placeholder="Enter your review here..."></textarea>
        </div>
        <div class="mb-3 text-center">
            <button type="submit" class="btn btn-primary px-4 py-2">
                <i class="bi bi-search"></i> Analyze
            </button>
        </div>
    </form>

    {% if sentiment %}
    <div class="mt-4 card shadow-sm">
        <div class="card-body">
            <h2 class="card-title">Analysis Results</h2>
            <p><strong>Sentiment:</strong>
                <span class="badge 
                    {% if sentiment == 'positive' %}bg-success
                    {% elif sentiment == 'negative' %}bg-danger
                    {% else %}bg-warning text-dark{% endif %}">
                    {{ sentiment }}
                </span>
            </p>

            {% if reply %}
            <div class="mt-3">
                <strong>AI-Generated Reply:</strong>
                <div class="alert alert-info mt-2" id="aiReplyText">{{ reply }}</div>
                <button class="btn btn-sm btn-outline-secondary mt-2" onclick="copyReply()">
                    <i class="bi bi-clipboard"></i> Copy Reply
                </button>
            </div>
            {% endif %}
        </div>
    </div>
    {% endif %}
</div>

<!-- Clipboard Copy Script -->
<script>
    function copyReply() {
        const replyText = document.getElementById('aiReplyText').textContent;

        navigator.clipboard.writeText(replyText)
            .then(() => {
                const btn = event.target;
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="bi bi-check2-circle"></i> Copied!';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 2000);
            })
            .catch(err => {
                console.error('Failed to copy text: ', err);
            });
    }
</script>

{% endblock %}
