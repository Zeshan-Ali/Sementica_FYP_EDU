{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Import Product Reviews</h2>
    <div class="card shadow">
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label for="product_url" class="form-label">Walmart Product URL</label>
                    <input type="url" class="form-control" id="product_url" name="product_url" 
                           placeholder="https://www.walmart.com/reviews/product/..." required>
                    <div class="form-text">Paste the Walmart product reviews page URL</div>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-cloud-download"></i> Fetch Reviews
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
